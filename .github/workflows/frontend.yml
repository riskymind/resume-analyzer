# Frontend checks and the browser test of the full user journey. Verification only: nothing is deployed.
# The browser test runs the real API with the FAKE AI provider (backend/scripts/mock_ai_server.py): no AI key is
# configured, no AI credits are used, and the data lives in a throwaway SQLite database.
# Backend checks are in backend.yml; images, the Compose stack and the deployment manifests in docker.yml (which
# also runs this same browser journey against the containers).
name: Frontend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, lint, format, unit tests, build, audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=low

  e2e:
    name: Browser journey (fake AI provider)
    runs-on: ubuntu-24.04
    needs: checks
    timeout-minutes: 20
    env:
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: System libraries for PDF export (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b fonts-dejavu-core
      - name: Backend dependencies (the fake AI provider lives in the test suite)
        run: pip install -r backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Frontend API types match the backend schema
        run: |
          (cd backend && python -m scripts.export_openapi ../frontend/openapi.json)
          (cd frontend && npm run types:generate)
          git diff --exit-code -- frontend/openapi.json frontend/src/types/api.generated.ts
      # Uses the Google Chrome preinstalled on GitHub's Ubuntu runners (playwright.config.ts: channel 'chrome').
      - run: npm run test:e2e
        working-directory: frontend
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
