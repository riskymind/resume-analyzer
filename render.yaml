# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Render Blueprint: the API (Docker web service) and its PostgreSQL database. The frontend is on Vercel
# (vercel.json). Nothing here deploys by itself: auto-deploy is off, and the Blueprint has to be applied
# deliberately from the Render dashboard. Guide: docs/deploy-render.md.
#
# Secrets are never written here: GEMINI_API_KEY and CORS_ORIGINS are entered in the dashboard when the
# Blueprint is first applied (sync: false); BACKEND_ACCESS_KEY is generated by Render once and must then be
# copied into the Vercel project's environment variables. The API refuses to start in production without it.

services:
  - type: web
    name: resume-analyzer-api
    runtime: docker
    # Private preview runs on the free plan (no billing): sleeps after 15 idle minutes, no pre-deploy command,
    # no SSH/shell. Before real users: plan starter (or higher), restore preDeployCommand, drop
    # RUN_MIGRATIONS_ON_START. See docs/deploy-render.md §3.
    plan: free
    region: oregon
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # Liveness only (no dependencies), so a database blip does not restart the service.
    healthCheckPath: /api/v1/health
    # Free instances have no preDeployCommand: migrations run at start-up instead (RUN_MIGRATIONS_ON_START
    # below). Advisory-locked; if a migration fails the new instance never passes its health check, so the
    # deploy fails and the previous version keeps serving.
    # No deploy on push; deploy manually (or switch to checksPass once CI is trusted).
    autoDeployTrigger: "off"
    # In-flight AI requests can take up to 90 s; uvicorn gets GRACEFUL_SHUTDOWN_SECONDS of this window.
    maxShutdownDelaySeconds: 120
    numInstances: 1
    buildFilter:
      paths:
        - backend/**
      ignoredPaths:
        - backend/tests/**
        - backend/**/*.md
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: resume-analyzer-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      # Kill switch: "false" holds the key but makes no Gemini calls (AI routes answer 503). Set it to "true"
      # in the dashboard only when live AI usage is authorized; re-syncing this Blueprint resets it to "false".
      - key: AI_CALLS_ENABLED
        value: "false"
      # The public HTTPS origin(s) of the Vercel frontend, comma-separated, e.g. https://resume-analyzer.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Shared secret the Vercel proxy sends in X-Backend-Access-Key; direct requests are refused (403).
      # Required in production (fail closed). Never hard-code it here.
      - key: BACKEND_ACCESS_KEY
        generateValue: true
      # Render's proxy is the only peer; with the access key set, X-Forwarded-For is Vercel's (client) value.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GRACEFUL_SHUTDOWN_SECONDS
        value: "100"
      - key: LOG_LEVEL
        value: INFO
      # Free plan only (no pre-deploy step): the entrypoint migrates (advisory-locked) before uvicorn starts.
      - key: RUN_MIGRATIONS_ON_START
        value: "true"

databases:
  - name: resume-analyzer-db
    # Free: 1 GB, NO backups, expires 30 days after creation (deleted 14 days later unless upgraded); one
    # free database per workspace. Fictional test data only. Upgrade (e.g. basic-256mb) before real users.
    plan: free
    region: oregon
    # databaseName, user, region and postgresMajorVersion cannot be changed after creation.
    databaseName: resume_analyzer
    user: resume
    postgresMajorVersion: "16"
    # No external connections; only services in the same region/workspace reach it over the private network.
    ipAllowList: []
